 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkedIn Performance Report — Month 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D;
    --paper:#F7F5F1;
    --card:#FFFFFF;
    --brass:#A67C3D;
    --brass-soft:#EFE3D0;
    --good:#3F6C51;
    --good-soft:#E4EDE6;
    --warn:#9A5A2E;
    --muted:#6B6F76;
    --line:#DDD8CE;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 28px;}

  /* ---------- HERO ---------- */
  .hero{
    background:var(--ink);
    color:var(--paper);
    padding:64px 0 56px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;
    right:-120px;top:-120px;
    width:340px;height:340px;
    border:1px solid rgba(247,245,241,0.14);
    border-radius:50%;
  }
  .hero::before{
    content:"";
    position:absolute;
    right:-40px;top:-40px;
    width:200px;height:200px;
    border:1px solid rgba(247,245,241,0.14);
    border-radius:50%;
  }
  .hero-person{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:28px;
  }
  .hero-photo{
    width:72px;height:72px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid rgba(247,245,241,0.35);
    flex-shrink:0;
  }
  .hero-person-text .pname{
    font-family:'Newsreader',serif;
    font-size:19px;
    font-weight:600;
    margin:0 0 3px;
    color:var(--paper);
  }
  .hero-person-text .prole{
    font-size:13px;
    color:var(--brass);
    margin:0 0 3px;
  }
  .hero-person-text .pmeta{
    font-size:12px;
    color:rgba(247,245,241,0.55);
    margin:0;
  }

  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 18px;
  }
  .hero h1{
    font-family:'Newsreader',serif;
    font-weight:500;
    font-size:44px;
    line-height:1.12;
    margin:0 0 10px;
    max-width:600px;
  }
  .hero .client{
    font-size:16px;
    color:rgba(247,245,241,0.72);
    margin:0 0 40px;
  }
  .hero .client strong{color:var(--paper);font-weight:600;}
  .stat-row{
    display:flex;
    gap:0;
    flex-wrap:wrap;
    border-top:1px solid rgba(247,245,241,0.18);
    padding-top:28px;
  }
  .stat{
    flex:1 1 140px;
    padding-right:24px;
  }
  .stat .num{
    font-family:'Newsreader',serif;
    font-size:34px;
    font-weight:600;
    display:block;
    line-height:1;
  }
  .stat .lbl{
    font-size:12px;
    color:rgba(247,245,241,0.6);
    margin-top:8px;
    display:block;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }

  /* ---------- SECTIONS ---------- */
  section{padding:56px 0;}
  section.tight{padding-top:0;}
  h2{
    font-family:'Newsreader',serif;
    font-weight:500;
    font-size:26px;
    margin:0 0 6px;
  }
  .section-sub{
    color:var(--muted);
    font-size:14.5px;
    margin:0 0 32px;
    max-width:600px;
  }

  /* ---------- SUMMARY TEXT ---------- */
  .summary-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:32px;
    font-size:15.5px;
    line-height:1.7;
    color:#33363D;
  }
  .summary-card p{margin:0 0 14px;}
  .summary-card p:last-child{margin-bottom:0;}

  /* ---------- CHART ---------- */
  .chart-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:32px 32px 24px;
  }
  .bar-row{
    display:grid;
    grid-template-columns:120px 1fr 70px;
    align-items:center;
    gap:14px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .bar-row:last-child{border-bottom:none;}
  .bar-row .plabel{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
  }
  .bar-track{
    height:10px;
    background:var(--brass-soft);
    border-radius:2px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    background:var(--brass);
    border-radius:2px;
  }
  .bar-fill.top{background:var(--good);}
  .bar-row .val{
    font-family:'IBM Plex Mono',monospace;
    text-align:right;
    font-weight:600;
  }
  .chart-legend{
    display:flex;gap:20px;margin-top:18px;
    font-size:12px;color:var(--muted);
  }
  .chart-legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .dot.brass{background:var(--brass);}
  .dot.good{background:var(--good);}

  /* ---------- POST CARDS ---------- */
  .post-grid{display:flex;flex-direction:column;gap:16px;}
  .post-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:26px 28px;
    position:relative;
  }
  .post-card.best{border-color:var(--good);}
  .post-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    margin-bottom:16px;
  }
  .post-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--brass);
    letter-spacing:0.08em;
    margin:0 0 6px;
  }
  .post-topic{
    font-family:'Newsreader',serif;
    font-size:19px;
    font-weight:600;
    margin:0;
  }
  .badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    padding:4px 9px;
    border-radius:20px;
    white-space:nowrap;
    height:fit-content;
  }
  .badge.good{background:var(--good-soft);color:var(--good);}
  .badge.watch{background:#F3E7DC;color:var(--warn);}
  .metrics-row{
    display:flex;
    gap:28px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .metric{font-size:13.5px;color:var(--muted);}
  .metric b{
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
    display:block;
    margin-bottom:2px;
  }
  .post-note{
    font-size:13.5px;
    line-height:1.6;
    color:#4A4D54;
    border-top:1px solid var(--line);
    padding-top:14px;
    margin-top:2px;
  }
  .post-link{
    font-size:12px;
    display:inline-block;
    margin-top:10px;
    color:var(--brass);
    text-decoration:none;
    border-bottom:1px solid transparent;
  }
  .post-link:hover{border-bottom-color:var(--brass);}

  /* ---------- INSIGHTS ---------- */
  .insight-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .insight-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:24px;
  }
  .insight-card h3{
    font-family:'Newsreader',serif;
    font-size:16px;
    margin:0 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .insight-card ul{
    margin:0;padding-left:18px;
    font-size:13.5px;
    line-height:1.65;
    color:#42454C;
  }
  .insight-card li{margin-bottom:6px;}

  /* ---------- RECOMMENDATIONS ---------- */
  .rec-list{list-style:none;margin:0;padding:0;counter-reset:rec;}
  .rec-list li{
    counter-increment:rec;
    display:flex;
    gap:18px;
    padding:18px 0;
    border-bottom:1px solid var(--line);
  }
  .rec-list li:last-child{border-bottom:none;}
  .rec-list li::before{
    content:counter(rec, decimal-leading-zero);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--brass);
    flex-shrink:0;
    padding-top:2px;
  }
  .rec-list .rec-body b{
    display:block;
    font-size:14.5px;
    margin-bottom:4px;
  }
  .rec-list .rec-body p{
    margin:0;
    font-size:13.5px;
    color:var(--muted);
    line-height:1.6;
  }

  /* ---------- DISCOVERY / DEMOGRAPHICS ---------- */
  .discovery-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:30px 32px;
    margin-bottom:20px;
  }
  .discovery-stats{display:flex;gap:56px;margin-bottom:26px;flex-wrap:wrap;}
  .stat-block .num{
    font-family:'Newsreader',serif;
    font-size:32px;font-weight:600;
    display:block;line-height:1;color:var(--ink);
  }
  .stat-block .lbl{
    font-size:12px;color:var(--muted);
    text-transform:uppercase;letter-spacing:0.05em;
    margin-top:6px;display:block;
  }
  .split-label{display:flex;justify-content:space-between;font-size:12.5px;color:#42454C;margin-bottom:7px;}
  .split-label b{color:var(--ink);}
  .split-track{display:flex;height:11px;border-radius:2px;overflow:hidden;}
  .split-fill.in{background:var(--ink);}
  .split-fill.out{background:var(--brass);}
  .split-caption{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px;}

  .demo-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  .demo-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:22px 24px;
  }
  .demo-card h4{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;text-transform:uppercase;
    letter-spacing:0.08em;color:var(--brass);
    margin:0 0 16px;
  }
  .demo-item{margin-bottom:13px;}
  .demo-item:last-child{margin-bottom:0;}
  .demo-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;gap:8px;}
  .demo-top span:first-child{color:#33363D;}
  .demo-top span:last-child{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;color:var(--ink);white-space:nowrap;}
  .demo-track{height:5px;background:var(--brass-soft);border-radius:2px;overflow:hidden;}
  .demo-fill{height:100%;background:var(--brass);border-radius:2px;}

  /* ---------- NOTABLE ENGAGERS ---------- */
  .engager-table{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
  }
  .eg-head{
    display:grid;
    grid-template-columns:1.4fr 2fr 1fr 1.1fr;
    gap:14px;
    padding:14px 24px;
    background:var(--ink);
    color:rgba(247,245,241,0.65);
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .eg-row{
    display:grid;
    grid-template-columns:1.4fr 2fr 1fr 1.1fr;
    gap:14px;
    padding:16px 24px;
    border-bottom:1px solid var(--line);
    align-items:center;
  }
  .eg-row:last-child{border-bottom:none;}
  .eg-row:nth-child(even){background:#FBFAF7;}
  .eg-name{font-weight:600;font-size:13.5px;color:var(--ink);}
  .eg-title{font-size:12.5px;color:var(--muted);line-height:1.4;}
  .eg-posts{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#42454C;}
  .eg-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;text-transform:uppercase;letter-spacing:0.05em;
    padding:4px 8px;border-radius:20px;
    display:inline-block;width:fit-content;
  }
  .eg-tag.repeat{background:var(--good-soft);color:var(--good);}
  .eg-tag.exec{background:var(--brass-soft);color:var(--brass);}
  .eg-tag.reach{background:#E8ECF3;color:#3A4E7A;}

  @media(max-width:640px){
    .demo-grid{grid-template-columns:1fr;}
    .discovery-stats{gap:32px;}
    .eg-head{display:none;}
    .eg-row{grid-template-columns:1fr;gap:6px;padding:16px 20px;}
  }

  /* ---------- OUTREACH ---------- */
  .outreach-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:30px 32px;
    margin-bottom:20px;
  }
  .funnel-row{display:flex;gap:0;flex-wrap:wrap;margin-bottom:26px;}
  .funnel-block{flex:1 1 140px;padding-right:20px;position:relative;}
  .funnel-block:not(:last-child)::after{
    content:"→";
    position:absolute;
    right:-2px;top:6px;
    color:var(--line);
    font-size:20px;
  }
  .funnel-block .num{
    font-family:'Newsreader',serif;
    font-size:30px;font-weight:600;
    display:block;line-height:1;color:var(--ink);
  }
  .funnel-block .lbl{
    font-size:11.5px;color:var(--muted);
    text-transform:uppercase;letter-spacing:0.05em;
    margin-top:7px;display:block;
  }
  .tag-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .tag-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    background:var(--brass-soft);
    color:var(--brass);
    padding:5px 11px;
    border-radius:20px;
  }
  .outreach-status{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12.5px;
    color:var(--muted);
    margin-top:4px;
  }
  .status-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--warn);
    flex-shrink:0;
    animation:none;
  }

  footer{
    border-top:1px solid var(--line);
    padding:28px 0 48px;
    font-size:12px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }

  @media(max-width:640px){
    .hero h1{font-size:32px;}
    .stat{flex:1 1 45%;margin-bottom:18px;}
    .insight-grid{grid-template-columns:1fr;}
    .bar-row{grid-template-columns:80px 1fr 55px;}
  }
</style>
</head>
